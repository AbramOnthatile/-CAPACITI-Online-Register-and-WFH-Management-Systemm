spring.application.name=capaciti-online-register-backend

# Local settings from a git-ignored .env file in this folder (see .env.example).
# Real environment variables still win over values in the file.
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL. SUPABASE_DB_URL must start with jdbc:postgresql://
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.timezone=Africa/Johannesburg
# Trust X-Forwarded-For only from these immediate proxy IPs/CIDRs; empty means no proxy trust.
app.proxy.trusted-proxies=${APP_TRUSTED_PROXIES:}
# Comma-separated list of frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini.api-key=${GEMINI_API_KEY:}
teams.webhook-url=${TEAMS_WEBHOOK_URL:}
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Demo data seeder: runs only when SEED_ENABLED=true and SEED_PASSWORD is set.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
